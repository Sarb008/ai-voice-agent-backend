<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgentForge — AI Agent Backend Demo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0b1020;
            color: #e8ecf4;
            min-height: 100vh;
        }

        header {
            height: 72px;
            padding: 0 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #242c42;
            background: #11172a;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
        }

        header p {
            margin: 4px 0 0;
            color: #929bb0;
            font-size: 13px;
        }

        .status {
            font-size: 13px;
            color: #7ee2a8;
        }

        .layout {
            display: grid;
            grid-template-columns: 340px 1fr;
            height: calc(100vh - 72px);
        }

        aside {
            padding: 22px;
            border-right: 1px solid #242c42;
            background: #0f1526;
            overflow-y: auto;
        }

        main {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        h2 {
            font-size: 15px;
            margin: 0 0 14px;
            color: #cbd3e5;
        }

        input,
        textarea {
            width: 100%;
            background: #171e32;
            color: #eef2f8;
            border: 1px solid #303950;
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 10px;
            font: inherit;
            outline: none;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            border-color: #6576ff;
        }

        button {
            border: 0;
            border-radius: 8px;
            padding: 10px 14px;
            background: #6374f5;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .secondary {
            background: #252e45;
        }

        .full {
            width: 100%;
        }

        .divider {
            height: 1px;
            background: #242c42;
            margin: 22px 0;
        }

        .agent {
            padding: 12px;
            margin-bottom: 8px;
            border: 1px solid #293249;
            border-radius: 9px;
            cursor: pointer;
            background: #151c2e;
        }

        .agent:hover {
            border-color: #5363d8;
        }

        .agent.active {
            border-color: #6374f5;
            background: #1b2440;
        }

        .agent-name {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .agent-description {
            color: #8993a8;
            font-size: 12px;
        }

        .chat-header {
            padding: 20px 26px;
            border-bottom: 1px solid #242c42;
            min-height: 80px;
        }

        .chat-header h2 {
            font-size: 18px;
            margin-bottom: 4px;
            color: #f1f4fa;
        }

        .chat-header p {
            margin: 0;
            font-size: 13px;
            color: #929bb0;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 26px;
        }

        .empty {
            color: #7f899e;
            text-align: center;
            margin-top: 100px;
        }

        .message {
            max-width: 760px;
            padding: 12px 15px;
            margin-bottom: 14px;
            border-radius: 10px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .message.user {
            margin-left: auto;
            background: #6374f5;
            color: white;
        }

        .message.assistant {
            background: #182036;
            border: 1px solid #29334c;
        }

        .message p:first-child {
            margin-top: 0;
        }

        .message p:last-child {
            margin-bottom: 0;
        }

        .message pre {
            overflow-x: auto;
            padding: 12px;
            background: #0b1020;
            border-radius: 7px;
        }

        .message code {
            font-family: Consolas, monospace;
        }

        .role {
            display: block;
            font-size: 11px;
            opacity: 0.65;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .composer {
            padding: 18px 26px;
            border-top: 1px solid #242c42;
            display: flex;
            gap: 10px;
        }

        .composer input {
            margin: 0;
        }

        .composer button {
            min-width: 90px;
        }

        #notice {
            min-height: 20px;
            margin-top: 10px;
            font-size: 12px;
            color: #f0b66b;
        }

        @media (max-width: 760px) {
            .layout {
                grid-template-columns: 1fr;
                height: auto;
            }

            aside {
                border-right: 0;
                border-bottom: 1px solid #242c42;
            }

            main {
                height: 70vh;
            }
        }
    </style>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
</head>

<body>
<header>
    <div>
        <h1>AgentForge</h1>
        <p>Configurable AI agents backed by Flask, SQLite and Gemini</p>
    </div>

    <div class="status" id="api-status">
        ● Checking API
    </div>
</header>

<div class="layout">

    <aside>
        <h2>Create Agent</h2>

        <input id="agent-name" placeholder="Agent name">

        <input id="agent-description" placeholder="Short description">

        <textarea
            id="system-prompt"
            placeholder="System prompt — e.g. You are a helpful interview coach."
        ></textarea>

        <button class="full" onclick="createAgent()">
            Create Agent
        </button>

        <div id="notice"></div>

        <div class="divider"></div>

        <h2>Agents</h2>

        <div id="agents">
            Loading...
        </div>
    </aside>

    <main>

        <div class="chat-header">
            <h2 id="current-agent">Select an agent</h2>
            <p id="current-description">
                Choose an existing agent or create one to begin.
            </p>
        </div>

        <div id="messages">
            <div class="empty">
                Select an agent to start a conversation.
            </div>
        </div>

        <div class="composer">
            <input
                id="message-input"
                placeholder="Send a message..."
                disabled
            >

            <button
                id="send-button"
                onclick="sendMessage()"
                disabled
            >
                Send
            </button>
        </div>

    </main>
</div>

<script>
    let selectedAgent = null;
    let conversationId = null;
    let sending = false;

    const STORAGE_AGENT_KEY = "agentforge_selected_agent";
    const STORAGE_CONVERSATION_KEY = "agentforge_conversation";

    function saveSession() {
        if (selectedAgent) {
            localStorage.setItem(STORAGE_AGENT_KEY, selectedAgent.id);
        }

        if (conversationId) {
            localStorage.setItem(STORAGE_CONVERSATION_KEY, conversationId);
        }
    }

    function clearSession() {
        localStorage.removeItem(STORAGE_AGENT_KEY);
        localStorage.removeItem(STORAGE_CONVERSATION_KEY);
    }

    async function api(url, options = {}) {
        const response = await fetch(url, options);

        let data;

        try {
            data = await response.json();
        } catch {
            data = {};
        }

        if (!response.ok) {
            throw new Error(
                data.error || `Request failed (${response.status})`
            );
        }

        return data;
    }

    async function checkHealth() {
        const status = document.getElementById("api-status");

        try {
            await api("/health");
            status.textContent = "● API Online";
        } catch {
            status.textContent = "● API Unavailable";
            status.style.color = "#ff8080";
        }
    }

    async function loadAgents() {
        const container = document.getElementById("agents");

        try {
            const data = await api("/agents");

            container.innerHTML = "";

            if (!data.agents.length) {
                container.innerHTML =
                    '<div class="agent-description">No agents yet.</div>';
                return;
            }

            for (const agent of data.agents) {
                const element = document.createElement("div");

                element.className = "agent";

                if (selectedAgent && selectedAgent.id === agent.id) {
                    element.classList.add("active");
                }

                const name = document.createElement("div");
                name.className = "agent-name";
                name.textContent = agent.name;

                const description = document.createElement("div");
                description.className = "agent-description";
                description.textContent =
                    agent.description || "No description";

                element.append(name, description);

                element.onclick = () => selectAgent(agent);

                container.appendChild(element);
            }

        } catch (error) {
            container.textContent = "Could not load agents.";
            showNotice(error.message);
        }
    }

    async function createAgent() {
        const name =
            document.getElementById("agent-name").value.trim();

        const description =
            document.getElementById("agent-description").value.trim();

        const systemPrompt =
            document.getElementById("system-prompt").value.trim();

        if (!name || !systemPrompt) {
            showNotice("Agent name and system prompt are required.");
            return;
        }

        try {
            const data = await api("/agents", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    name,
                    description,
                    system_prompt: systemPrompt
                })
            });

            document.getElementById("agent-name").value = "";
            document.getElementById("agent-description").value = "";
            document.getElementById("system-prompt").value = "";

            showNotice("Agent created.");

            await loadAgents();
            await selectAgent(data.agent);

        } catch (error) {
            showNotice(error.message);
        }
    }

    async function selectAgent(agent) {
        selectedAgent = agent;
        conversationId = null;

        document.getElementById("current-agent").textContent =
            agent.name;

        document.getElementById("current-description").textContent =
            agent.description || "AI agent";

        document.getElementById("messages").innerHTML =
            '<div class="empty">Starting conversation...</div>';

        document.getElementById("message-input").disabled = true;
        document.getElementById("send-button").disabled = true;

        await loadAgents();

        try {
            const data = await api(
                `/agents/${agent.id}/conversations`,
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({})
                }
            );

            conversationId = data.conversation.id;
            saveSession();

            document.getElementById("messages").innerHTML =
                '<div class="empty">Conversation ready. Send a message.</div>';

            document.getElementById("message-input").disabled = false;
            document.getElementById("send-button").disabled = false;

            document.getElementById("message-input").focus();

        } catch (error) {
            document.getElementById("messages").innerHTML =
                '<div class="empty">Could not start conversation.</div>';

            showNotice(error.message);
        }
    }

    function addMessage(role, content) {
        const container = document.getElementById("messages");

        const empty = container.querySelector(".empty");

        if (empty) {
            empty.remove();
        }

        const message = document.createElement("div");
        message.className = `message ${role}`;

        const roleLabel = document.createElement("span");
        roleLabel.className = "role";
        roleLabel.textContent =
            role === "user" ? "You" : "Assistant";

        const contentElement = document.createElement("div");

        if (role === "assistant") {
            contentElement.innerHTML = DOMPurify.sanitize(
                marked.parse(content)
            );
        } else {
            contentElement.textContent = content;
        }

        message.append(roleLabel, contentElement);
        container.appendChild(message);

        container.scrollTop = container.scrollHeight;
    }

    async function sendMessage() {
        if (!conversationId || sending) {
            return;
        }

        const input = document.getElementById("message-input");
        const button = document.getElementById("send-button");

        const content = input.value.trim();

        if (!content) {
            return;
        }

        sending = true;
        input.disabled = true;
        button.disabled = true;
        button.textContent = "Thinking...";

        addMessage("user", content);
        input.value = "";

        const idempotencyKey =
            crypto.randomUUID
                ? crypto.randomUUID()
                : `${Date.now()}-${Math.random()}`;

        try {
            const data = await api(
                `/conversations/${conversationId}/messages`,
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Idempotency-Key": idempotencyKey
                    },
                    body: JSON.stringify({
                        role: "user",
                        content
                    })
                }
            );

            if (data.assistant_message) {
                addMessage(
                    "assistant",
                    data.assistant_message.content
                );
            }

        } catch (error) {
            addMessage(
                "assistant",
                `Request failed: ${error.message}`
            );
        } finally {
            sending = false;
            input.disabled = false;
            button.disabled = false;
            button.textContent = "Send";
            input.focus();
        }
    }

    function showNotice(message) {
        const notice = document.getElementById("notice");

        notice.textContent = message;

        setTimeout(() => {
            if (notice.textContent === message) {
                notice.textContent = "";
            }
        }, 5000);
    }

    document
        .getElementById("message-input")
        .addEventListener("keydown", event => {
            if (event.key === "Enter") {
                event.preventDefault();
                sendMessage();
            }
        });

    async function restoreSession() {
        const agentId = localStorage.getItem(STORAGE_AGENT_KEY);
        const savedConversationId =
            localStorage.getItem(STORAGE_CONVERSATION_KEY);

        if (!agentId || !savedConversationId) {
            await loadAgents();
            return;
        }

        try {
            const agentsData = await api("/agents");

            const agent = agentsData.agents.find(
                item => item.id === agentId
            );

            if (!agent) {
                clearSession();
                await loadAgents();
                return;
            }

            await api(`/conversations/${savedConversationId}`);

            selectedAgent = agent;
            conversationId = savedConversationId;

            document.getElementById("current-agent").textContent =
                agent.name;

            document.getElementById("current-description").textContent =
                agent.description || "AI agent";

            document.getElementById("message-input").disabled = false;
            document.getElementById("send-button").disabled = false;

            await loadAgents();

            const data = await api(
                `/conversations/${conversationId}/messages`
            );

            const container = document.getElementById("messages");
            container.innerHTML = "";

            if (!data.messages.length) {
                container.innerHTML =
                    '<div class="empty">Conversation ready. Send a message.</div>';
            } else {
                for (const message of data.messages) {
                    addMessage(message.role, message.content);
                }
            }

        } catch (error) {
            clearSession();

            selectedAgent = null;
            conversationId = null;

            await loadAgents();

            document.getElementById("messages").innerHTML =
                '<div class="empty">Select an agent to start a conversation.</div>';
        }
    }
    checkHealth();
    restoreSession();
</script>

</body>
</html>
